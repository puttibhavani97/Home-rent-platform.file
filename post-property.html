<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Property - House Rent Platform</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 50px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f9f9f9;
        }

        form label {
            display: block;
            margin-bottom: 8px;
        }

        form input,
        form select,
        form textarea,
        form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        form button {
            background-color: #5cb85c;
            color: white;
            cursor: pointer;
        }

        form button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>

<body>
    <header>
        <h1>Post Your Property</h1>
    </header>

    <section class="form-container">
        <form id="postPropertyForm" method="POST" action="{% url 'post_property' %}">
            <!-- {% csrf_token %} -->
            <label for="title">Property Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>

            <label for="price">Price (in $):</label>
            <input type="number" id="price" name="price" required>

            <label for="Bedrooms">Bedrooms:</label>
            <input type="number" id="Bedrooms" name="Bedrooms" required>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required>

            <label for="property_type">Property Type:</label>
            <select id="property_type" name="property_type" required>
                <option value="rent">Rent</option>
                <option value="buy">Buy</option>
            </select>

            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <button type="submit">Post Property</button>
        </form>
    </section>

    <script>
        document.getElementById('postPropertyForm').onsubmit = async function (e) {
            e.preventDefault();
            const formData = new FormData(this);

            const response = await fetch("{% url 'post_property' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            });

            if (response.ok) {
                alert("Property posted successfully!");
                this.reset();
            } else {
                alert("Failed to post property. Please try again.");
            }
        }
    </script>
</body>

</html>
