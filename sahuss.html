
<template id="login-form-template" class="gbs">
    <div id="login-form">
        <div class="hrp-container" id="hrp-container">
            <div class="hrp-form-container hrp-sign-up-container">
                <form action="#" class="sgb-form">
                    <h1 class="sa">Create Account</h1>
                    <div class="hrp-social-container">
                        <a href="#" class="hrp-social"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="hrp-social"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" class="hrp-social"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                    <span>or use your email for registration</span>
                    <input type="text" placeholder="Name" class="bbss" />
                    <input type="email" placeholder="Email" class="bbss" />
                    <input type="password" placeholder="Password" class="bbss" />
                    <button>Sign Up</button>
                </form>
            </div>
            <div class="hrp-form-container hrp-sign-in-container">
                <form action="#" class="sgb-form">
                    <h1 class="sa">Sign in</h1>
                    <div class="hrp-social-container">
                        <a href="#" class="hrp-social"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="hrp-social"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" class="hrp-social"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                    <span class="bgs">or use your account</span>
                    <input type="email" placeholder="Email" class="bbss" />
                    <input type="password" placeholder="Password" class="bbss"/>
                    <a href="#">Forgot your password?</a>
                    <button class="but">Sign In</button>
                </form>
            </div>
            <div class="hrp-overlay-container">
                <div class="hrp-overlay">
                    <div class="hrp-overlay-panel hrp-overlay-left">
                        <h1 class="sa">Welcome Back!</h1>
                        <p class="sahu">To keep connected with us please login with your personal info</p>
                        <button class="hrp-ghost but" id="hrp-signIn">Sign In</button>
                    </div>
                    <div class="hrp-overlay-panel hrp-overlay-right">
                        <h1 class="sa">Hello, Friend!</h1>
                        <p class="sahu">Enter your personal details and start journey with us</p>
                        <button class="hrp-ghost but" id="hrp-signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="ggbb">
            <p class="sahu">
                Created with <i class="fa fa-heart"></i> by
                <a target="_blank" href="https://florin-pop.com">Florin Pop</a>
                - Read how I created this and how you can join the challenge
                <a target="_blank" href="https://www.florin-pop.com/blog/2019/03/double-slider-sign-in-up-form/">here</a>.
            </p>
        </footer>
