<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Property</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Book Your Property</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/submit-booking/">
                    <div class="mb-3">
                        <label for="propertyTitle" class="form-label">Property Title</label>
                        <input type="text" id="propertyTitle" name="property_title" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Preferred Booking Date</label>
                        <input type="date" id="date" name="date" class="form-control" required>
                    </div>
                    <button class="btn btn-primary book-now-btn"
                    onclick="window.location.href='booking_confirmation.html'">Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Populate the property title dynamically
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const propertyTitle = urlParams.get('title');
            document.getElementById('propertyTitle').value = propertyTitle || "Unknown Property";
        });
    </script>
</body>

</html>
