<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Property</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            max-width: 600px;
            margin: auto;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .card-header {
            background-color: #2d0de3;
            color: white;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .card-body {
            padding: 30px;
        }

        .form-control {
            border-radius: 5px;
        }

        .btn-success {
            width: 100%;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">Book Your Property</div>
            <div class="card-body">
                <form method="post" action="{% url 'book_now' property.id %}">
                    {% csrf_token %}
                    <input type="hidden" name="property_id" value="{{ property.id }}">

                    <div class="mb-3">
                        <label for="propertyTitle" class="form-label">Property Title</label>
                        <input type="text" id="propertyTitle" name="property_title" class="form-control"
                            value="{{ property.name }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="check_in_date" class="form-label">Check-In Date</label>
                        <input type="date" id="check_in_date" name="check_in_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="check_out_date" class="form-label">Check-Out Date</label>
                        <input type="date" id="check_out_date" name="check_out_date" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
