<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Viewed</title>
</head>

<body>
    <h2>Recently Viewed Properties</h2>

    {% if properties %}
    <ul>
        {% for property in properties %}
        <li>
            <a href="{% url 'property_detail' property.id %}">{{ property.title }} - {{ property.location }}</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No recently viewed properties.</p>
    {% endif %}

    <a href="{% url 'index' %}">Back to Listings</a>
</body>

</html>
