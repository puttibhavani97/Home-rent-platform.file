<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Rent Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Post Property Form -->
    <div class="container mt-5">
        <h2>Post Your Property</h2>
        <form id="post-property-form">
            <div class="mb-3">
                <label for="property-title" class="form-label">Property Title</label>
                <input type="text" id="property-title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="property-location" class="form-label">Location</label>
                <input type="text" id="property-location" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="property-price" class="form-label">Price (in Lacs)</label>
                <input type="number" id="property-price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="property-bedrooms" class="form-label">Number of Bedrooms</label>
                <select id="property-bedrooms" class="form-select">
                    <option value="1 BHK">1 BHK</option>
                    <option value="2 BHK">2 BHK</option>
                    <option value="3 BHK">3 BHK</option>
                    <option value="4 BHK">4 BHK</option>
                    <option value="5+ BHK">5+ BHK</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Post Property</button>
        </form>
    </div>

    <!-- Property Listings -->
    <div class="container mt-5">
        <h2>Properties for Buy/Rent</h2>
        <div id="main-content" class="row">
            <!-- Dynamically added property cards will show up here -->
        </div>
    </div>

    <!-- JavaScript for dynamic content -->
    <script>
        document.getElementById('post-property-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('property-title').value;
            const location = document.getElementById('property-location').value;
            const price = document.getElementById('property-price').value;
            const bedrooms = document.getElementById('property-bedrooms').value;

            const propertyCard = `
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Property Image">
                        <div class="card-body">
                            <h5 class="card-title">${title}</h5>
                            <p class="card-text">${bedrooms} | Location: ${location}</p>
                            <p class="card-text"><strong>Price: ₹${price} Lacs</strong></p>
                            <button class="btn btn-primary">Book Now</button>
                            <button class="btn btn-outline-secondary">Contact</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('main-content').insertAdjacentHTML('beforeend', propertyCard);
            this.reset(); // Clear the form
        });
    </script>
</body>
</html>
